<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,65 90,80 50,95 10,80%22 fill=%22%2322d3ee%22/><circle cx=%2250%22 cy=%2235%22 r=%2225%22 fill=%22%23ec4899%22/></svg>">
    <link rel="apple-touch-icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,65 90,80 50,95 10,80%22 fill=%22%2322d3ee%22/><circle cx=%2250%22 cy=%2235%22 r=%2225%22 fill=%22%23ec4899%22/></svg>">
    <link rel="manifest" href="manifest.json">
    <title>Cảnh Báo Hệ Thống | Cyber Beat Hopper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #020108; color: #ff0055; overflow: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-text { text-shadow: 0 0 15px rgba(255,0,85,0.8), 0 0 30px rgba(255,0,85,0.4); }

        .glitch-text { position: relative; display: inline-block; }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.9;
        }
        .glitch-text::before {
            color: #00ffff;
            z-index: -1;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            color: #ffff00;
            z-index: -2;
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-4px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(4px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(4px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(-4px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(4px, 2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translate(-4px, -2px); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, -1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-4px, 2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(4px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-4px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(4px, 2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-4px, -2px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen text-center p-4">
    <!-- Nút chuyển đổi ngôn ngữ -->
    <div class="absolute top-4 right-4 z-[60] flex items-center gap-2 font-black font-orbitron text-sm">
        <button id="btn-lang-vi" onclick="setLanguage('vi')" class="text-gray-500 hover:text-cyan-300 transition-colors">VI</button>
        <span class="text-gray-600">|</span>
        <button id="btn-lang-en" onclick="setLanguage('en')" class="text-cyan-400 hover:text-cyan-300 transition-colors">EN</button>
    </div>

    <div class="border-2 border-red-500/50 p-8 md:p-12 rounded-2xl bg-black/80 shadow-[0_0_40px_rgba(255,0,85,0.3)] max-w-xl w-full flex flex-col items-center relative z-10">
        <svg class="w-24 h-24 mb-6 animate-pulse text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        
        <h1 id="warn-heading" class="glitch-text text-3xl md:text-5xl font-black mb-4 neon-text tracking-widest uppercase font-orbitron leading-tight" data-text="Ey zô quách súp!!!">Ey zô quách súp!!!</h1>
        
        <p id="warn-message" class="text-sm md:text-base text-gray-300 mb-8 leading-relaxed">
            Hệ thống phát hiện hành vi bất thường.<br>Bảo vệ bởi MeoTN Easy AntiCheat.<br><br><span class="text-red-400 font-bold uppercase">Chà... Bạn đang làm gì đó ở hậu trường thế? Vui lòng đóng các công cụ kiểm tra để tiếp tục nhé!</span>
        </p>
        
        <button id="warn-btn" onclick="window.location.href='index.html'" class="w-full md:w-auto px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(220,38,38,0.5)] font-orbitron active:scale-95">QUAY LẠI TRÒ CHƠI</button>
    </div>

    <!-- Hiệu ứng sọc CRT mờ ảo toàn màn hình -->
    <div class="fixed inset-0 pointer-events-none z-50 bg-[linear-gradient(to_bottom,rgba(255,255,255,0),rgba(255,255,255,0)_50%,rgba(0,0,0,0.2)_50%,rgba(0,0,0,0.2))] bg-[length:100%_4px]"></div>

    <script src="js/warning-alert.js"></script>
</body>
</html>
