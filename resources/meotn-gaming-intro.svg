<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glowR" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowY" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineL" x1="0" x2="1">
      <stop offset="0" stop-color="#f04a3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#f04a3a"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" x2="1">
      <stop offset="0" stop-color="#f04a3a"/>
      <stop offset="1" stop-color="#f04a3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Chu kỳ 12s: vẽ (~4.1s) -> chờ 3s -> reverse (xoá ngược) -> lặp lại -->
  <style>
    .dr { stroke-dasharray: 1 2; stroke-dashoffset: 1; }
    .red { fill: none; stroke: #f04a3a; stroke-linecap: round; stroke-linejoin: round; }
    .yel { fill: none; stroke: #f7ee6e; stroke-linecap: square; stroke-linejoin: miter; stroke-width: 18; }
    .gam { fill: none; stroke: #f04a3a; stroke-linecap: square; stroke-linejoin: miter; stroke-width: 7; }
    .eye { fill: #f04a3a; opacity: 0; animation: keye 12.0s infinite; }
    .cat { animation: kcat 12.0s infinite; }
    .word { filter: url(#glowY); }
    .glowtext { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
    .ln { transform-box: fill-box; opacity: 0; transform: scaleX(0); animation: kln 12.0s infinite; }
    .ln.l { transform-origin: right center; }
    .ln.r { transform-origin: left center; }
    .shine { fill: #fff; opacity: 0; mix-blend-mode: overlay; animation: kshine 12.0s infinite; }
    @keyframes keye{0%,10.833%{opacity:0}13.833%{opacity:1}15.000%{opacity:.3}18.333%{opacity:1}45.833%{opacity:1}46.667%{opacity:.35}47.500%{opacity:1}75.000%{opacity:1}82.500%{opacity:0}100%{opacity:0}}
