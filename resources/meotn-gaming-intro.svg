    @keyframes kshine{0%,30.000%{transform:translateX(-120px) skewX(-20deg);opacity:0}33.000%{opacity:.55}40.000%{transform:translateX(780px) skewX(-20deg);opacity:0}100%{transform:translateX(780px) skewX(-20deg);opacity:0}}
